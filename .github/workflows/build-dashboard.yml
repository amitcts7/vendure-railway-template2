name: Build React Dashboard

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'vite.config.mts'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Vite temp compilation
        uses: actions/cache@v4
        with:
          path: .vendure-dashboard-temp
          key: vite-temp-${{ hashFiles('src/**', 'package-lock.json') }}
          restore-keys: vite-temp-

      - name: Install dependencies
        run: npm install

      - name: Build React Dashboard
        run: npx vite build

      - name: Commit built dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/dashboard
          git diff --staged --quiet || git commit -m "chore: pre-build React dashboard [skip ci]"
          git push
